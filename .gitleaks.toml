# CapTracker gitleaks config — extends the default ruleset.
title = "CapTracker gitleaks"

[extend]
useDefault = true

# Test files intentionally contain fake, non-functional credentials (e.g. an
# encryption round-trip fixture, an owner pasting a dummy BambooHR key). These
# are never real secrets — real credentials live only in env / KMS — so exempt
# *.test.ts from the generic-secret heuristics to avoid false positives.
[[allowlist]]
description = "Fake secrets in test fixtures"
paths = ['''.*\.test\.ts$''']
