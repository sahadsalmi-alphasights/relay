name: Stale

# Auto-flags (and eventually closes) issues/PRs with no activity, so the
# backlog reflects reality. First-party GitHub action.

on:
  schedule:
    - cron: "30 1 * * *" # daily 01:30 UTC

permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 30
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "pinned,security,keep"
          exempt-pr-labels: "pinned,security,keep,dependencies"
          stale-issue-message: >
            This issue has had no activity for 30 days and is now marked stale.
            Comment or remove the `stale` label to keep it open; otherwise it will
            be closed in 14 days.
          stale-pr-message: >
            This PR has had no activity for 30 days and is now marked stale.
            Push or comment to keep it open; otherwise it will be closed in 14 days.
